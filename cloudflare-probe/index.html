<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>次元 · 新入口连接测试</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d1727;color:#e4edf6;font-family:system-ui,'Microsoft YaHei',sans-serif;line-height:1.8}main{max-width:660px;margin:7vh auto;padding:24px}small{color:#6edbc8;letter-spacing:2px}h1{font-size:29px;line-height:1.5;margin:16px 0}p{font-size:14px;color:#aebed1}.card{border:1px solid #30485d;background:#16283b;border-radius:15px;padding:20px;margin:22px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid #304459;padding:13px 0;font-size:14px}.row:last-child{border:0}.row strong{color:#7ee0ce;text-align:right}button,select{font:inherit;border:1px solid #416075;border-radius:8px;padding:10px 15px;background:#20394e;color:#d9eaf5}button{cursor:pointer}button.primary{background:#79d9cb;color:#10293a;border:0;font-weight:700}button:disabled{opacity:.5}label{font-size:13px}select{margin-left:9px;max-width:100%}.buttons{display:flex;gap:12px;flex-wrap:wrap}textarea{display:block;width:100%;height:160px;margin-top:16px;padding:13px;background:#0e1e30;color:#c8d9e7;border:1px solid #30485d;border-radius:8px;font:12px/1.8 monospace;resize:vertical}#message{min-height:26px}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #7ce2d0;outline-offset:3px}@media(max-width:400px){main{margin:2vh auto;padding:20px}h1{font-size:25px}.card{padding:16px}.row{font-size:13px}}</style></head><body><main><small>CIYUAN · ACCESS PROBE V1</small><h1>先验证连接，<br>再迁移放映室。</h1><p>请关闭 VPN，分别使用移动数据和 Wi-Fi 测试。本页不加载动漫、封面或播放器，只检查这个新入口及一个小型数据文件。</p><label for="network">当前网络<select id="network"><option>未选择</option><option>移动数据</option><option>Wi-Fi</option></select></label><section class="card" aria-label="检测结果"><div class="row"><span>网页已打开</span><strong>成功</strong></div><div class="row"><span>页面脚本</span><strong id="script">尚未运行</strong></div><div class="row"><span>同站数据请求</span><strong id="data">等待检测</strong></div><div class="row"><span>网页加载耗时</span><strong id="page-time">检测中</strong></div></section><div class="buttons"><button id="run" class="primary">重新检测</button><button id="copy">复制测试结果</button></div><p id="message" role="status"></p><textarea id="report" readonly aria-label="测试结果，可复制发送"></textarea><p>结果只在本机生成，不会上传，不读取 IP。页面成功不代表第三方视频可播放。若此地址打不开，请直接在聊天中说明，不必继续等待。</p></main><script>
(()=>{const $=s=>document.querySelector(s),state={version:'access-probe-v1',script:'成功',data:'未检测',pageMilliseconds:null,dataMilliseconds:null,checkedAt:null};let busy=false;$('#script').textContent='成功';function report(){const timing=performance.getEntriesByType('navigation')[0];state.pageMilliseconds=timing&&timing.loadEventEnd?Math.round(timing.loadEventEnd):null;$('#page-time').textContent=state.pageMilliseconds===null?'尚未完成':state.pageMilliseconds+' ms';$('#report').value=JSON.stringify({...state,network:$('#network').value,url:location.origin+location.pathname},null,2);}async function run(){if(busy)return;busy=true;$('#run').disabled=true;$('#data').textContent='检测中';$('#message').textContent='';const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),8000),start=performance.now();try{const r=await fetch('./probe.json?t='+Date.now(),{cache:'no-store',signal:controller.signal});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(j.marker!=='ciyuan-access-v1')throw Error('数据不匹配');state.dataMilliseconds=Math.round(performance.now()-start);state.data='成功';$('#data').textContent='成功 · '+state.dataMilliseconds+' ms';$('#message').textContent='请复制结果发给我，并换另一种网络再测一次。';}catch(e){state.data='失败：'+(e.name==='AbortError'?'8秒超时':e.message);state.dataMilliseconds=Math.round(performance.now()-start);$('#data').textContent=state.data;$('#message').textContent='网页可打开，但数据请求失败，请保留这个结果。';}finally{clearTimeout(timer);state.checkedAt=new Date().toISOString();busy=false;$('#run').disabled=false;report();}}$('#run').onclick=run;$('#network').onchange=report;$('#copy').onclick=async()=>{report();try{await navigator.clipboard.writeText($('#report').value);$('#message').textContent='测试结果已复制。';}catch{$('#report').focus();$('#report').select();$('#message').textContent='请长按结果框手动复制。';}};window.addEventListener('load',()=>setTimeout(report,0));report();run();})();
</script></body></html>
