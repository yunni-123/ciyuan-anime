name: Publish anime site and update metadata
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rankings_only:
        description: Refresh only yearly rankings
        type: boolean
        default: false
  schedule:
    - cron: '17 0,6,12,18 * * *'
    - cron: '47 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: anime-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Refresh public metadata
        if: github.event_name != 'push' && github.event.schedule != '47 * * * *' && !inputs.rankings_only
        run: node tools/sync-metadata.mjs docs
      - name: Check official production announcements
        if: github.event_name != 'push' && github.event.schedule != '47 * * * *' && !inputs.rankings_only
        run: node tools/sync-announcements.mjs docs
      - name: Refresh yearly Top 50 (hourly ranking)
        if: github.event_name != 'push'
        run: node tools/fetch-annual-top50.mjs docs
      - name: Reconcile series and yearly coverage
        if: github.event_name != 'push'
        run: node tools/complete-resources.mjs reconcile docs
      - name: Save updated metadata
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/vod-catalog.json docs/catalog.json docs/update-status.json docs/details docs/announcements.json docs/annual-top50.json docs/resource-coverage.json docs/resource-summary.json docs/completion-last-run.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update published anime metadata'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
          retention-days: 1
      - name: Deploy free Pages site
        id: deployment
        uses: actions/deploy-pages@v4
