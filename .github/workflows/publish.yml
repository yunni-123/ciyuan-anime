name: Daily site data and weekly references
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rankings_only:
        description: Refresh rankings only (otherwise refresh data and rankings)
        type: boolean
        default: false
  schedule:
    - cron: '17 0 * * *'
    - cron: '47 0 * * 1'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: anime-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh Japanese anime metadata daily
        id: resources
        continue-on-error: true
        if: github.event_name != 'push' && github.event.schedule != '47 0 * * 1' && !inputs.rankings_only
        run: node tools/sync-metadata.mjs docs
      - name: Refresh imported Japanese anime from requested Sakura site
        id: imported
        if: github.event_name != 'push' && github.event.schedule != '47 0 * * 1' && !inputs.rankings_only
        continue-on-error: true
        run: |
          node tools/yhdm-source.mjs docs
          node tools/check-yhdm-manifests.mjs docs
      - name: Refresh complete annual and weekly Japanese schedules
        id: schedules
        continue-on-error: true
        if: github.event_name != 'push' && !inputs.rankings_only
        run: |
          if [ "${{ github.event.schedule }}" = '47 0 * * 1' ]; then
            node tools/sync-schedule.mjs docs
          else
            node tools/sync-schedule.mjs docs --daily
          fi
      - name: Check production announcements daily
        id: announcements
        continue-on-error: true
        if: github.event_name != 'push' && github.event.schedule != '47 0 * * 1' && !inputs.rankings_only
        run: node tools/sync-announcements.mjs docs
      - name: Refresh bibliography, novels, series and external entry points
        id: content
        continue-on-error: true
        if: github.event_name != 'push' && !inputs.rankings_only
        run: |
          if [ "${{ github.event.schedule }}" = '47 0 * * 1' ] || [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            node tools/sync-content.mjs docs weekly
          else
            node tools/sync-content.mjs docs daily
          fi
      - name: Refresh annual Top50 weekly (preserve previous snapshot on failure)
        id: rankings
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '47 0 * * 1'
        continue-on-error: true
        run: node tools/fetch-annual-top50.mjs docs
      - name: Refresh manga and light novel annual Top50 weekly
        id: books
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '47 0 * * 1'
        run: node tools/sync-books.mjs docs
      - name: Refresh Chinese reading directory links weekly
        id: reading
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '47 0 * * 1'
        run: node tools/sync-reading-sources.mjs docs
      - name: Verify additional public Chinese reader entrances
        id: publicReading
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '47 0 * * 1'
        run: node tools/sync-public-reading.mjs docs
      - name: Refresh verified free novel samples and public manga chapters
        id: freeReading
        continue-on-error: true
        if: github.event_name != 'push'
        run: |
          if [ "${{ github.event.schedule }}" = '47 0 * * 1' ] || [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            node tools/sync-free-novels.mjs docs
            node tools/sync-additional-reading.mjs docs
            node tools/sync-wow-reading.mjs docs
          else
            node tools/sync-free-novels.mjs docs --refresh
            node tools/sync-additional-reading.mjs docs --refresh
            node tools/sync-wow-reading.mjs docs --refresh
          fi
          node tools/sync-free-manga.mjs docs
      - name: Reconcile series and yearly coverage
        id: coverage
        continue-on-error: true
        if: github.event_name != 'push'
        run: node tools/complete-resources.mjs reconcile docs
      - name: Record actual update times and schedule
        if: github.event_name != 'push'
        env:
          RANKING_OUTCOME: ${{ steps.rankings.outcome }}
          PIPELINE_OUTCOMES: '{"resources":"${{ steps.resources.outcome }}","imported":"${{ steps.imported.outcome }}","schedules":"${{ steps.schedules.outcome }}","announcements":"${{ steps.announcements.outcome }}","content":"${{ steps.content.outcome }}","rankings":"${{ steps.rankings.outcome }}","coverage":"${{ steps.coverage.outcome }}","books":"${{ steps.books.outcome }}","reading":"${{ steps.reading.outcome }}","publicReading":"${{ steps.publicReading.outcome }}","freeReading":"${{ steps.freeReading.outcome }}"}'
        run: node tools/update-status.mjs docs
      - name: Build lightweight data for Cloudflare same-origin delivery
        run: node tools/build-library-v2.mjs docs cloudflare-data
      - name: Package bounded static site
        run: node tools/build-cloudflare-v2.mjs
      - name: Validate catalogs and update pipeline
        run: node --test tools/update-pipeline.test.mjs tools/yhdm-source.test.mjs tools/loading-recovery.test.mjs tools/search-ranking.test.mjs tools/page-polish.test.mjs tools/experience.test.mjs tools/architecture.test.mjs tools/discovery.test.mjs tools/schedule.test.mjs tools/content-health.test.mjs tools/books.test.mjs tools/reading-sources.test.mjs tools/public-reading.test.mjs tools/free-reading.test.mjs
      - name: Save data for Cloudflare and GitHub Pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs cloudflare-data
          if ! git diff --cached --quiet; then
            git commit -m 'Update published anime metadata'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: cloudflare-v2-dist/preview
          retention-days: 1
      - name: Deploy free GitHub Pages fallback
        id: deployment
        uses: actions/deploy-pages@v4
